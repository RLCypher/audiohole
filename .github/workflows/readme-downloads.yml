name: Keep README downloads on the latest release

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audiohole-readme-downloads
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          ref: main
      - name: Resolve the latest published installer and portable ZIP
        run: python3 scripts/UpdateReadmeDownloads.py
      - name: Commit only the two download URL changes
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README downloads are already current."
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -s -m 'Update README downloads to the latest release [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

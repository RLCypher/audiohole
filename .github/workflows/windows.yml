name: Windows builds and evaluation packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify Windows prerequisites (read-only)
        run: ./scripts/Verify-Environment.ps1
      - name: Test distribution-tool safeguards
        run: ./tests/scripts/Test-DistributionTools.ps1
      - name: Verify canonical branding and icon resources
        run: python scripts/branding/verify_assets.py
      - name: Configure Windows x64
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-${{ matrix.configuration }} --parallel 2
      - name: Package unverified Release tester build
        if: matrix.configuration == 'release'
        shell: pwsh
        run: |
          ./scripts/Package.ps1 -Configuration Release -Unverified -OutputDirectory build/tester-packages
          $zip = @(Get-ChildItem build/tester-packages/*.zip)
          if ($zip.Count -ne 1) { throw 'Expected exactly one unverified tester package.' }
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath build/tester-artifact
      - name: Upload unverified Release tester build
        if: matrix.configuration == 'release'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: AudioHole-UNVERIFIED-tester-Windows-x64-release-${{ github.sha }}
          path: build/tester-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Verify embedded branding resources
        shell: pwsh
        run: |
          $configuration = '${{ matrix.configuration }}'
          $configuration = $configuration.Substring(0,1).ToUpperInvariant() + $configuration.Substring(1)
          python scripts/branding/verify_assets.py --executable "build/windows-msvc/bin/$configuration/audiohole.exe"
      - name: Test COM, simulator, presentation, and native GUI smoke
        run: ctest --preset windows-${{ matrix.configuration }}
      - name: Package only the runtime component
        shell: pwsh
        run: |
          $configuration = '${{ matrix.configuration }}'
          $configuration = $configuration.Substring(0,1).ToUpperInvariant() + $configuration.Substring(1)
          ./scripts/Package.ps1 -Configuration $configuration
      - name: Launch the extracted package outside the build tree
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem build/packages/*.zip)
          if ($zip.Count -ne 1) { throw 'Expected exactly one package.' }
          ./scripts/Test-Package.ps1 -Archive $zip[0].FullName
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath build/artifact
      - name: Upload tested package contents (downloaded as a ZIP)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: AudioHole-Windows-x64-${{ matrix.configuration }}-${{ github.sha }}
          path: build/artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload GUI smoke screenshots and evidence
        if: ${{ always() && hashFiles('build/windows-msvc/gui-smoke/**') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: AudioHole-GUI-evidence-${{ matrix.configuration }}-${{ github.sha }}
          path: build/windows-msvc/gui-smoke/
          if-no-files-found: warn
          retention-days: 14

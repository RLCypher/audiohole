name: Windows builds and evaluation packages

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      capture_evidence:
        description: Capture screenshots and upload evidence bundles
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source:
    name: Prepare matching source
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      timestamp: ${{ steps.names.outputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - name: Read version and establish the build timestamp
        id: names
        shell: pwsh
        run: |
          . ./scripts/Build-Names.ps1
          $project = Get-Content ./CMakeLists.txt -Raw
          if ($project -notmatch 'project\(AudioHole VERSION (\d+\.\d+\.\d+) ') { throw 'Cannot read version' }
          "version=$(Get-AudioHoleDisplayVersion $Matches[1])" >> $env:GITHUB_OUTPUT
          "commit=$($env:GITHUB_SHA.Substring(0,7))" >> $env:GITHUB_OUTPUT
          "timestamp=$([DateTime]::UtcNow.ToString("yyyy-MM-dd'T'HH:mm:ss'Z'"))" >> $env:GITHUB_OUTPUT
      - name: Fetch pinned corresponding dependency sources
        run: cmake --preset windows-msvc -DAUDIOHOLE_BUILD_TIMESTAMP=${{ steps.names.outputs.timestamp }}
      - name: Package one matching source archive
        run: ./scripts/Source-Package.ps1
      # Source availability precedes binary publication. The filenames sort as
      # Installer, Portable, ZIP-debug and ZIP-source without numeric prefixes.
      - name: Upload matching source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          path: build/source/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-and-test:
    needs: source
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      AUDIOHOLE_CAPTURE_EVIDENCE: ${{ inputs.capture_evidence && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - name: Read display version and commit
        id: names
        shell: pwsh
        run: |
          . ./scripts/Build-Names.ps1
          $project = Get-Content ./CMakeLists.txt -Raw
          if ($project -notmatch 'project\(AudioHole VERSION (\d+\.\d+\.\d+) ') { throw 'Cannot read version' }
          "version=$(Get-AudioHoleDisplayVersion $Matches[1])" >> $env:GITHUB_OUTPUT
          "commit=$($env:GITHUB_SHA.Substring(0,7))" >> $env:GITHUB_OUTPUT
      - name: Verify Windows prerequisites (read-only)
        run: ./scripts/Verify-Environment.ps1
      - name: Test distribution-tool safeguards
        run: ./tests/scripts/Test-DistributionTools.ps1
      - name: Verify canonical branding and icon resources
        run: python scripts/branding/verify_assets.py
      - name: Verify tutorial catalogue and MSVC literal sizes
        run: python scripts/GenerateTutorial.py --check
      - name: Configure Windows x64
        run: cmake --preset windows-msvc -DAUDIOHOLE_BUILD_TIMESTAMP=${{ needs.source.outputs.timestamp }}
      - name: Build
        run: cmake --build --preset windows-${{ matrix.configuration }} --parallel 2
      - name: Verify embedded branding resources
        shell: pwsh
        run: |
          $configuration = '${{ matrix.configuration }}'
          $configuration = $configuration.Substring(0,1).ToUpperInvariant() + $configuration.Substring(1)
          python scripts/branding/verify_assets.py --executable "build/windows-msvc/bin/$configuration/AudioHole.exe"
      - name: Test native GUI, tutorial, engine and restart smoke
        run: ctest --preset windows-${{ matrix.configuration }} -R '^Gui\.'
      - name: Test engine, scanner, model, COM and presentation contracts
        run: ctest --preset windows-${{ matrix.configuration }} -E '^Gui\.'
      - name: Package only the runtime component
        id: package
        shell: pwsh
        run: |
          $configuration = '${{ matrix.configuration }}'
          $configuration = $configuration.Substring(0,1).ToUpperInvariant() + $configuration.Substring(1)
          ./scripts/Package.ps1 -Configuration $configuration
      - name: Launch the extracted package outside the build tree
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem build/packages/*.zip)
          if ($zip.Count -ne 1) { throw 'Expected exactly one package.' }
          ./scripts/Test-Package.ps1 -Archive $zip[0].FullName
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath build/artifact
      - name: Build and test standalone Release installer
        if: matrix.configuration == 'release'
        id: installer
        shell: pwsh
        run: |
          $compiler = "$env:ProgramFiles/Inno Setup 7/ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler) -or [version](Get-Item $compiler).VersionInfo.FileVersionRaw -lt [version]"7.1.1.0") {
            $download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
            Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe -OutFile $download
            if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw 'Installer compiler integrity check failed' }
            $compilerDirectory = Split-Path $compiler
            $process = Start-Process $download -ArgumentList '/ALLUSERS', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$compilerDirectory`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'Installer compiler setup failed' }
          }
          $zip = @(Get-ChildItem build/packages/*.zip)
          ./scripts/Build-Installer.ps1 -Archive $zip[0].FullName -Compiler $compiler
          $setup = @(Get-ChildItem -LiteralPath build/installer -Filter 'AudioHole Installer v*.exe' -File)
          if ($setup.Count -ne 1) { throw 'Expected one installer' }
          ./scripts/Test-Installer.ps1 -Installer $setup[0].FullName
      - name: Verify installer-free portable download
        id: portable
        shell: pwsh
        run: |
          $folders = @(Get-ChildItem build/artifact -Directory)
          if ($folders.Count -ne 1) { throw 'Expected one portable application folder' }
          ./scripts/Test-PortableBundle.ps1 -Directory $folders[0].FullName
          "directory=$($folders[0].FullName)" >> $env:GITHUB_OUTPUT
      - name: Upload standalone Release installer
        if: matrix.configuration == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          path: build/installer/*.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload tested portable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          path: build/packages/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload GUI smoke screenshots and evidence
        if: ${{ always() && inputs.capture_evidence == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: AudioHole-v${{ steps.names.outputs.version }}-GUI-evidence-${{ matrix.configuration }}-${{ steps.names.outputs.commit }}
          path: build/windows-msvc/gui-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload installer lifecycle logs
        if: ${{ always() && inputs.capture_evidence == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: AudioHole-v${{ steps.names.outputs.version }}-installer-evidence-${{ matrix.configuration }}-${{ steps.names.outputs.commit }}
          path: build/installer-evidence/
          if-no-files-found: warn
          retention-days: 14
